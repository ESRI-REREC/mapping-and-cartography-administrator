<!doctype html>
<html lang="en" class="calcite-mode-light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<title>Unassigned · Mapping &amp; Cartography Administration</title>

		<script type="importmap">
			{
				"imports": {
					"@arcgis/core/": "https://js.arcgis.com/4.31/@arcgis/core/"
				}
			}
		</script>

		<link
			rel="stylesheet"
			href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css" />
		<script
			type="module"
			src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>
		<link
			rel="stylesheet"
			href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
		<script
			type="module"
			src="https://js.arcgis.com/4.31/map-components/arcgis-map-components.esm.js"></script>

		<link rel="stylesheet" href="styles.css" />
	</head>

	<body>
		<calcite-shell>
			<calcite-navigation slot="header">
				<calcite-navigation-logo
					slot="logo"
					heading="Design Administration"
					description="Mapping &amp; Cartography"></calcite-navigation-logo>
				<calcite-menu slot="content-end" label="Workflow">
					<calcite-menu-item text="Unassigned" href="unassigned.html" active></calcite-menu-item>
					<calcite-menu-item text="In progress" href="in-progress.html"></calcite-menu-item>
					<calcite-menu-item text="Completed" href="completed.html"></calcite-menu-item>
				</calcite-menu>
			</calcite-navigation>

			<calcite-panel>
				<!-- page.js fills this with a filter bar + table. -->
				<div id="pane-unassigned" class="pane-host"></div>
			</calcite-panel>

			<calcite-alert
				id="app-alert"
				auto-close
				auto-close-duration="medium"
				scale="m"
				slot="alerts">
				<div slot="title" id="alert-title"></div>
				<div slot="message" id="alert-message"></div>
			</calcite-alert>
		</calcite-shell>

		<!-- Assign-designer sheet — opened when an Unassigned row is clicked. -->
		<calcite-sheet
			id="assign-sheet"
			position="inline-end"
			width-scale="m"
			aria-labelledby="assign-heading">
			<calcite-panel>
				<div slot="header-content" class="project-heading">
					<span class="project-title" id="assign-heading">Assign designer</span>
					<span class="project-ref" id="assign-subheading"></span>
				</div>
				<calcite-action
					slot="header-actions-end"
					icon="x"
					text="Close"
					id="assign-close"></calcite-action>

				<div class="sheet-body">
					<calcite-label>
						Designer <span class="req">*</span>
						<calcite-select id="assign-designer"></calcite-select>
					</calcite-label>
					<calcite-label>
						Due date
						<calcite-input-date-picker id="assign-due"></calcite-input-date-picker>
					</calcite-label>
					<calcite-label>
						Instructions
						<calcite-text-area
							id="assign-instructions"
							placeholder="Optional notes for the designer…"></calcite-text-area>
					</calcite-label>
				</div>

				<calcite-button
					slot="footer-start"
					appearance="outline"
					kind="neutral"
					width="half"
					id="assign-cancel">
					Cancel
				</calcite-button>
				<calcite-button slot="footer-end" width="half" id="assign-submit">
					Assign
				</calcite-button>
			</calcite-panel>
		</calcite-sheet>

		<!-- Shared column filter modal (opened from a column's ⋯ → Filter…). -->
		<calcite-modal
			id="filter-dialog"
			width-scale="s"
			aria-labelledby="filter-dialog-heading">
			<div slot="header" id="filter-dialog-heading">Filter</div>
			<div slot="content">
				<calcite-label>
					<span id="filter-dialog-label">Value contains</span>
					<calcite-input
						id="filter-input"
						placeholder="Type a value…"
						clearable></calcite-input>
				</calcite-label>
			</div>
			<calcite-button
				slot="secondary"
				appearance="outline"
				kind="neutral"
				id="filter-cancel">
				Cancel
			</calcite-button>
			<calcite-button slot="primary" id="filter-apply">Apply filter</calcite-button>
		</calcite-modal>

		<calcite-scrim id="boot-scrim" loading></calcite-scrim>

		<script src="config.js"></script>
		<script type="module" src="unassigned.js"></script>
	</body>
</html>
